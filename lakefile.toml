name = "erdos_488_lean"
version = "0.1.0"
defaultTargets = ["Erdos488", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "Erdos488"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
[lean_lib.leanOptions]
warn.sorry = false

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
